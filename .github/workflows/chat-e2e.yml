name: Chat E2E

on:
  push:

permissions:
  contents: read
  issues: read

jobs:
  select-cards:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      cards: ${{ steps.cards.outputs.cards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/active-cards.sh
  browser:
    needs: select-cards
    if: needs.select-cards.outputs.cards != '[]'
    name: Chat E2E / ${{ matrix.card }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        card: ${{ fromJSON(needs.select-cards.outputs.cards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test test/e2e/${{ matrix.card }}.spec.js
