name: Scenario source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'rkkautsar/group-chat-scenario'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.js && node --check web/app.js
      - run: node --check test/e2e/threads.spec.js && node --check test/e2e/mentions.spec.js && node --check test/e2e/search.spec.js && node --check test/e2e/muting.spec.js
